# Publishes the three static files to GitHub Pages. Nothing on the Pi is
# exposed to the internet: the public copy is served by GitHub, the Pi keeps
# serving itself over loopback.
name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # the share-audio prompt asks a stranger to hand over their screen, which
  # is a bad look on a public URL. Set to "auto" to keep the analyser.
  PUBLIC_AUDIO_SOURCE: "off"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html main.js styles.css _site/
          [ -f CNAME ] && cp CNAME _site/ || true

          if [ "$PUBLIC_AUDIO_SOURCE" != "auto" ]; then
            grep -q 'source: "auto"' _site/main.js  # fail loudly if CONFIG moved
            sed -i "s/source: \"auto\"/source: \"$PUBLIC_AUDIO_SOURCE\"/" _site/main.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
